<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mapa CETYS Universidad</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&display=swap">
<style>
/* Layout: plano 2D del campus a pantalla completa + panel de navegación (abajo en celular, a un lado en escritorio). Paleta neutra tipo señalética, sin colores institucionales. */
:root{
  --bg:#eef0ee; --panel:#ffffff; --fg:#18201c; --muted:#5d6a63; --line:#d6ddd8;
  --accent:#1f6f8b; --route:#e2560f; --me:#1a6dde;
  --ground:#e3e4df; --outside:#cfd3cc; --grass:#9fc98a; --grass2:#8fbd79; --tree:#5f9a52; --dirt:#d9c6a5;
  --road:#7b807d; --road-mark:#f2f2ee; --roof:#fafaf8; --label:#18201c; --field:#7fbf62; --field-line:#f5f8f2;
  --c-acad:#2f5fb3; --c-serv:#0e8770; --c-cult:#a3307d; --c-dep:#5e7f12; --c-park:#6b7280;
  --f-display:"Barlow Condensed","Arial Narrow",sans-serif; --f-body:"Barlow",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1412; --panel:#161d1a; --fg:#e6ece8; --muted:#98a69e; --line:#2a3430;
  --accent:#5fb6d4; --route:#ff7a33; --me:#4d9bff;
  --ground:#262b28; --outside:#151a17; --grass:#22382a; --grass2:#27402f; --tree:#33573a; --dirt:#3a3428;
  --road:#454b48; --road-mark:#7b817d; --roof:#303733; --label:#eef3ef; --field:#2a4a2e; --field-line:#7d9a80;
  --c-acad:#7ba3f2; --c-serv:#43cdb0; --c-cult:#e77bc4; --c-dep:#a8cf4f; --c-park:#a3aab5; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1412; --panel:#161d1a; --fg:#e6ece8; --muted:#98a69e; --line:#2a3430;
  --accent:#5fb6d4; --route:#ff7a33; --me:#4d9bff;
  --ground:#262b28; --outside:#151a17; --grass:#22382a; --grass2:#27402f; --tree:#33573a; --dirt:#3a3428;
  --road:#454b48; --road-mark:#7b817d; --roof:#303733; --label:#eef3ef; --field:#2a4a2e; --field-line:#7d9a80;
  --c-acad:#7ba3f2; --c-serv:#43cdb0; --c-cult:#e77bc4; --c-dep:#a8cf4f; --c-park:#a3aab5; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;display:flex;flex-direction:column;overflow:hidden}
header{padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:var(--panel);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px 14px;flex-wrap:wrap}
.brand{display:flex;flex-direction:column;min-width:0}
.eyebrow{font-family:var(--f-display);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);font-weight:600}
h1{margin:0;font-family:var(--f-display);font-size:22px;font-weight:700;line-height:1.1}
.legend{display:flex;gap:4px 10px;flex-wrap:wrap;margin-left:auto;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:11px;height:11px;border-radius:2px;border:2px solid;display:inline-block}
main{flex:1;display:flex;flex-direction:column;min-height:0}
.mapwrap{position:relative;flex:1;min-height:0;background:var(--outside)}
svg#map{width:100%;height:100%;display:block;touch-action:none;cursor:grab;user-select:none}
.zoom{position:absolute;right:max(12px,env(safe-area-inset-right,0px));top:12px;display:flex;flex-direction:column;gap:6px}
.zoom button{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--fg);font-size:20px;font-weight:600;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.15)}
.zoom button:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.demo-tag{position:absolute;left:max(12px,env(safe-area-inset-left,0px));top:12px;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:5px 11px;font-size:12px;color:var(--muted);max-width:calc(100% - 90px)}
.sheet{background:var(--panel);border-top:1px solid var(--line);padding-block:14px 16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:12px;max-height:46%;overflow-y:auto}
.lbl{font-family:var(--f-display);font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600}
.here{display:flex;align-items:center;gap:10px}
.here .dot{width:14px;height:14px;border-radius:50%;background:var(--me);box-shadow:0 0 0 4px color-mix(in srgb,var(--me) 25%,transparent);flex:none}
.here strong{font-size:16px;font-weight:600}
.field{display:grid;gap:5px}
select{font:inherit;font-size:16px;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--fg);width:100%}
.summary{display:flex;align-items:baseline;gap:6px 14px;flex-wrap:wrap;padding:12px 14px;border-radius:12px;background:color-mix(in srgb,var(--route) 10%,var(--panel));border:1px solid color-mix(in srgb,var(--route) 35%,transparent)}
.summary .big{font-family:var(--f-display);font-size:30px;font-weight:700;color:var(--route);font-variant-numeric:tabular-nums;line-height:1}
.summary .sub{color:var(--muted);font-size:14px;min-width:0}
.summary.idle{background:var(--bg);border-color:var(--line)}
.hint{margin:0;font-size:13px;color:var(--muted);line-height:1.4}
@media (min-width:820px){
  main{flex-direction:row}
  .sheet{width:340px;max-height:none;border-top:0;border-left:1px solid var(--line);align-content:start;padding-block:20px}
}
/* mapa */
.bld{cursor:pointer}
.bld .roof{fill:var(--roof)}
.bld .edge{fill:none;stroke-width:3;stroke-linejoin:round}
.bld.park .roof{fill:url(#stalls)}
.bld.dep.fieldish .roof{fill:var(--field)}
.bld.sel .edge{stroke-width:6}
.bld text.name{font-family:var(--f-display);font-weight:700;font-size:14px;fill:var(--label);text-anchor:middle;pointer-events:none;paint-order:stroke;stroke:var(--roof);stroke-width:3px}
.bld.park text.name,.bld.fieldish text.name{stroke:var(--ground)}
.bld.small text.name{display:none;font-size:10px;stroke:var(--ground)}
.zoomed .bld.small text.name{display:block}
.badge circle{fill:var(--label)} .badge text{fill:var(--roof);font-family:var(--f-display);font-weight:700;font-size:11px;text-anchor:middle;pointer-events:none}
.acad .edge{stroke:var(--c-acad)} .serv .edge{stroke:var(--c-serv)} .cult .edge{stroke:var(--c-cult)} .dep .edge{stroke:var(--c-dep)} .park .edge{stroke:var(--c-park)}
.bld.sel.acad .roof{fill:color-mix(in srgb,var(--c-acad) 22%,var(--roof))}
.bld.sel.serv .roof{fill:color-mix(in srgb,var(--c-serv) 22%,var(--roof))}
.bld.sel.cult .roof{fill:color-mix(in srgb,var(--c-cult) 22%,var(--roof))}
.route-base{fill:none;stroke:var(--route);stroke-width:8;stroke-linecap:round;stroke-linejoin:round;opacity:.92}
.route-flow{fill:none;stroke:#fff;stroke-width:3;stroke-linecap:round;stroke-dasharray:1 15;animation:flow 1s linear infinite}
@keyframes flow{to{stroke-dashoffset:-16}}
.pulse{animation:pulse 1.8s ease-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pulse{0%{transform:scale(.6);opacity:.6}100%{transform:scale(2.2);opacity:0}}
@media (prefers-reduced-motion:reduce){.route-flow,.pulse{animation:none}}
#me{cursor:move}
</style>
</head>
<body>

<header>
  <div class="brand">
    <span class="eyebrow">Campus Mexicali</span>
    <h1>Mapa CETYS Universidad</h1>
  </div>
  <div class="legend" aria-label="Tipos de lugar">
    <span><i style="border-color:var(--c-acad)"></i>Académico</span>
    <span><i style="border-color:var(--c-serv)"></i>Servicios</span>
    <span><i style="border-color:var(--c-cult)"></i>Cultura</span>
    <span><i style="border-color:var(--c-dep)"></i>Deporte</span>
    <span><i style="border-color:var(--c-park)"></i>Estacionamiento</span>
  </div>
</header>
<main>
  <div class="mapwrap">
    <svg id="map" viewBox="0 0 1000 730" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Plano del campus CETYS Mexicali">
      <defs>
        <pattern id="stalls" width="18" height="34" patternUnits="userSpaceOnUse">
          <rect width="18" height="34" fill="var(--road)"/>
          <line x1="1" y1="3" x2="1" y2="31" stroke="var(--road-mark)" stroke-width="1.4"/>
        </pattern>
      </defs>
      <g id="base"></g>
      <g id="routeLayer"></g>
      <g id="flagLayer"></g>
      <g id="me">
        <circle class="pulse" r="10" fill="var(--me)"/>
        <circle r="20" fill="var(--me)" opacity=".18"/>
        <circle r="9" fill="var(--me)" stroke="#fff" stroke-width="3"/>
      </g>
    </svg>
    <div class="demo-tag">Demo: arrastra el punto azul para simular tu ubicación</div>
    <div class="zoom">
      <button id="zin" aria-label="Acercar">+</button>
      <button id="zout" aria-label="Alejar">−</button>
      <button id="zfit" aria-label="Ver todo el campus" style="font-size:15px">⤢</button>
    </div>
  </div>
  <section class="sheet" aria-label="Navegación">
    <div class="here"><span class="dot"></span><div><div class="lbl">Estás en</div><strong id="here">—</strong></div></div>
    <div class="field">
      <label class="lbl" for="dest">¿A dónde vas?</label>
      <select id="dest"></select>
    </div>
    <div id="summary" class="summary idle"></div>
    <p class="hint">Toca un edificio en el plano o elígelo en la lista. Acerca el zoom para ver los nombres de los edificios pequeños.</p>
  </section>
</main>

<script>
const M = 0.6;            // metros aproximados por unidad del plano
const W = 1000, H = 730, CELL = 5;
// [núm, nombre, etiqueta, tipo, x1,y1,x2,y2, pequeño]
const RAW = [
  [1,'Dirección General',['Dirección','General'],'serv',246,67,290,117],
  [2,'CASE',['CASE'],'serv',239,136,279,172],
  [3,'Cafetería',['Cafetería'],'serv',321,130,371,174],
  [4,'Sorteos',['Sorteos'],'serv',407,82,437,108,1],
  [5,'Seguridad',['Seguridad'],'serv',401,120,427,142,1],
  [6,'Mantenimiento',['Mantenimiento'],'serv',455,123,485,147,1],
  [7,'Oficinas Administrativas',['Oficinas Adm.'],'serv',455,165,485,189,1],
  [8,'Biblioteca',['Biblioteca'],'acad',379,192,431,228],
  [9,'Enfermería y Escolar',['Enfermería y Escolar'],'serv',420,230,460,258,1],
  [10,'Auditorio',['Auditorio'],'cult',259,198,309,244],
  [11,'CECE',['CECE'],'acad',265,251,315,293],
  [12,'Edificio de Licenciatura',['Licenciatura'],'acad',280,302,320,358],
  [13,'Servicios Estudiantiles y Comunicación',['Serv. Estudiantiles'],'serv',441,262,471,284,1],
  [14,'Operación Académica y Dirección Académica',['Op. Académica'],'serv',487,285,513,307,1],
  [15,'Laboratorios de Ingeniería y CAOP',['Labs. Ingeniería'],'acad',536,306,576,338,1],
  [16,'Edificio Tita y Armando Gallego',['Tita y A. Gallego'],'acad',417,301,443,323,1],
  [17,'Edificio Esposos Hermosillo',['Esp. Hermosillo'],'acad',502,324,528,346,1],
  [18,'Edificio Kenworth',['Kenworth'],'acad',477,357,503,379,1],
  [19,'Edificio Heriberto Amarillas Heras y Clara Durazo de Amarillas',['Amarillas'],'acad',429,349,459,373,1],
  [20,'CEDENI',['CEDENI'],'acad',294,385,350,435],
  [21,'CAT',['CAT'],'acad',412,406,462,450],
  [22,'Educación Continua y Centro de Idiomas',['Educación','Continua'],'acad',311,498,367,542],
  [23,'Preparatoria',['Preparatoria'],'acad',613,280,683,320],
  [24,'Gimnasio',['Gimnasio'],'dep',714,48,810,108],
  [25,'Estadio de los Zorros',['Estadio de los Zorros'],'dep',740,212,940,305],
  [26,'CEID',['CEID'],'acad',594,366,694,456],
  ['P1','Estacionamiento Dirección General',['Est. Dirección'],'park',60,50,215,180],
  ['P2','Estacionamiento frente al Auditorio',['Est. Auditorio'],'park',60,195,215,330],
  ['P3','Estacionamiento CEDENI',['Est. CEDENI'],'park',60,395,260,475],
  ['P4','Estacionamiento Sur',['Est. Sur'],'park',60,560,290,690],
  ['P5','Estacionamiento Gimnasio',['Est. Gimnasio'],'park',830,48,960,185],
  ['P6','Estacionamiento Oriente',['Est. Oriente'],'park',600,650,960,698]
];
const PLACES = RAW.map(r=>({num:r[0],id:String(r[0]),name:r[1],lines:r[2],cat:r[3],x1:r[4],y1:r[5],x2:r[6],y2:r[7],small:!!r[8]}));
const byId = Object.fromEntries(PLACES.map(p=>[p.id,p]));
// obstáculos que no son destino (canchas cercadas)
const FIELDS = [
  {k:'fa',x1:720,y1:330,x2:920,y2:395},
  {k:'soc',x1:730,y1:420,x2:920,y2:510},
  {k:'soc',x1:730,y1:530,x2:920,y2:620},
  {k:'base',x1:603,y1:128,x2:707,y2:232}
];

// ---------- rejilla para calcular rutas ----------
const COLS=W/CELL|0, ROWS=H/CELL|0, blocked=new Uint8Array(COLS*ROWS);
const obst=[...PLACES.filter(p=>p.cat!=='park'),...FIELDS];
for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){
  const x=c*CELL+CELL/2,y=r*CELL+CELL/2;
  let b = x<42||x>968||y<42||y>702;
  if(!b) b = obst.some(o=>x>o.x1-2&&x<o.x2+2&&y>o.y1-2&&y<o.y2+2);
  blocked[r*COLS+c]=b?1:0;
}
const cellOf=(x,y)=>[Math.max(0,Math.min(COLS-1,x/CELL|0)),Math.max(0,Math.min(ROWS-1,y/CELL|0))];
const ctr=(c,r)=>[c*CELL+CELL/2,r*CELL+CELL/2];
const rectDist=(x,y,p)=>Math.hypot(Math.max(p.x1-x,0,x-p.x2),Math.max(p.y1-y,0,y-p.y2));
function nearestFree(c,r){
  if(!blocked[r*COLS+c])return [c,r];
  for(let d=1;d<60;d++)for(let dc=-d;dc<=d;dc++)for(let dr=-d;dr<=d;dr++){
    if(Math.max(Math.abs(dc),Math.abs(dr))!==d)continue;
    const cc=c+dc,rr=r+dr; if(cc>=0&&rr>=0&&cc<COLS&&rr<ROWS&&!blocked[rr*COLS+cc])return [cc,rr];
  }
  return [c,r];
}
function lineFree(a,b){
  const n=Math.ceil(Math.hypot(b[0]-a[0],b[1]-a[1])/2);
  for(let i=1;i<n;i++){const x=a[0]+(b[0]-a[0])*i/n,y=a[1]+(b[1]-a[1])*i/n,[c,r]=cellOf(x,y);if(blocked[r*COLS+c])return false}
  return true;
}
function findRoute(pt,place){
  const [sc,sr]=nearestFree(...cellOf(pt[0],pt[1])), start=sr*COLS+sc;
  const goalOK=i=>{const[x,y]=ctr(i%COLS,i/COLS|0);return rectDist(x,y,place)<=9};
  const hfun=i=>{const[x,y]=ctr(i%COLS,i/COLS|0);return Math.max(0,rectDist(x,y,place)-9)};
  const g=new Float32Array(COLS*ROWS).fill(Infinity), prev=new Int32Array(COLS*ROWS).fill(-1), closed=new Uint8Array(COLS*ROWS);
  const heap=[]; const push=(i,f)=>{heap.push([f,i]);let k=heap.length-1;while(k){const p=(k-1)>>1;if(heap[p][0]<=heap[k][0])break;[heap[p],heap[k]]=[heap[k],heap[p]];k=p}};
  const pop=()=>{const top=heap[0],last=heap.pop();if(heap.length){heap[0]=last;let k=0;for(;;){const l=2*k+1,r=l+1;let m=k;if(l<heap.length&&heap[l][0]<heap[m][0])m=l;if(r<heap.length&&heap[r][0]<heap[m][0])m=r;if(m===k)break;[heap[m],heap[k]]=[heap[k],heap[m]];k=m}}return top};
  g[start]=0; push(start,hfun(start)); let goal=-1;
  while(heap.length){
    const [,i]=pop(); if(closed[i])continue; closed[i]=1;
    if(goalOK(i)){goal=i;break}
    const c=i%COLS,r=i/COLS|0;
    for(let dc=-1;dc<=1;dc++)for(let dr=-1;dr<=1;dr++){
      if(!dc&&!dr)continue; const cc=c+dc,rr=r+dr; if(cc<0||rr<0||cc>=COLS||rr>=ROWS)continue;
      const j=rr*COLS+cc; if(blocked[j]||closed[j])continue;
      if(dc&&dr&&(blocked[r*COLS+cc]||blocked[rr*COLS+c]))continue;
      const ng=g[i]+(dc&&dr?1.4142:1)*CELL;
      if(ng<g[j]){g[j]=ng;prev[j]=i;push(j,ng+hfun(j))}
    }
  }
  if(goal<0)return null;
  const raw=[]; for(let i=goal;i!==-1;i=prev[i])raw.unshift(ctr(i%COLS,i/COLS|0));
  const sm=[raw[0]]; let k=0;
  while(k<raw.length-1){let j=raw.length-1;while(j>k+1&&!lineFree(raw[k],raw[j]))j--;sm.push(raw[j]);k=j}
  const path=[pt,...sm]; let len=0; for(let i=1;i<path.length;i++)len+=Math.hypot(path[i][0]-path[i-1][0],path[i][1]-path[i-1][1]);
  return {path,meters:len*M,end:sm[sm.length-1]};
}
function whereAmI(pt){
  const inside=PLACES.find(p=>pt[0]>=p.x1&&pt[0]<=p.x2&&pt[1]>=p.y1&&pt[1]<=p.y2);
  if(inside)return {text:inside.name,place:inside};
  let n=PLACES[0],bd=Infinity; PLACES.forEach(p=>{const d=rectDist(pt[0],pt[1],p);if(d<bd){bd=d;n=p}});
  return {text:'Cerca de '+n.name,place:null};
}

// ---------- dibujo ----------
function buildBase(){
  let s=`<rect x="-500" y="-500" width="2000" height="1800" fill="var(--outside)"/>`;
  s+=`<rect x="30" y="30" width="950" height="680" rx="22" fill="var(--ground)"/>`;
  s+=`<rect x="600" y="112" width="372" height="530" fill="var(--dirt)"/>`;
  const greens=[[217,44,240,704],[325,240,412,372],[370,458,590,512],[300,550,590,640],[478,150,530,232],[294,182,372,196]];
  greens.forEach(g=>s+=`<rect x="${g[0]}" y="${g[1]}" width="${g[2]-g[0]}" height="${g[3]-g[1]}" rx="4" fill="var(--grass)"/>`);
  // árboles en áreas verdes
  let seed=11; const rnd=()=>(seed=(seed*9301+49297)%233280)/233280;
  greens.forEach(g=>{const n=Math.round((g[2]-g[0])*(g[3]-g[1])/700);for(let i=0;i<n;i++){const x=g[0]+6+rnd()*(g[2]-g[0]-12),y=g[1]+6+rnd()*(g[3]-g[1]-12);s+=`<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${(3.5+rnd()*3).toFixed(1)}" fill="var(--tree)"/>`}});
  // vialidades
  s+=`<rect x="30" y="30" width="950" height="680" rx="22" fill="none" stroke="var(--road)" stroke-width="20"/>`;
  s+=`<rect x="30" y="30" width="950" height="680" rx="22" fill="none" stroke="var(--road-mark)" stroke-width="1.3" stroke-dasharray="12 10"/>`;
  s+=`<polyline points="710,112 710,640 972,640" fill="none" stroke="var(--road)" stroke-width="11" stroke-linejoin="round"/>`;
  // plaza, canchas de básquet, paneles
  s+=`<circle cx="560" cy="256" r="26" fill="#c2553f" opacity=".75"/><circle cx="560" cy="256" r="9" fill="var(--grass)"/>`;
  for(let i=0;i<2;i++)s+=`<rect x="${540+i*32}" y="172" width="26" height="54" rx="2" fill="#c9785f" opacity=".7" stroke="var(--field-line)"/>`;
  for(let i=0;i<5;i++)s+=`<rect x="480" y="${522+i*11}" width="110" height="7" fill="#3b6f8f" opacity=".65"/>`;
  // canchas
  FIELDS.forEach(f=>{
    const w=f.x2-f.x1,h=f.y2-f.y1;
    if(f.k==='base'){const cx=(f.x1+f.x2)/2,cy=f.y2-6;s+=`<path d="M${cx},${cy} L${f.x1+4},${cy-48} A70,70 0 0,1 ${f.x2-4},${cy-48} Z" fill="var(--field)"/><path d="M${cx},${cy} l-18,-18 l18,-18 l18,18 z" fill="var(--dirt)" stroke="var(--field-line)"/>`;return}
    s+=`<rect x="${f.x1}" y="${f.y1}" width="${w}" height="${h}" fill="var(--field)" stroke="var(--field-line)" stroke-width="2"/>`;
    if(f.k==='fa')for(let x=f.x1+20;x<f.x2;x+=16)s+=`<line x1="${x}" y1="${f.y1+3}" x2="${x}" y2="${f.y2-3}" stroke="var(--field-line)" stroke-width="1"/>`;
    else s+=`<line x1="${f.x1+w/2}" y1="${f.y1}" x2="${f.x1+w/2}" y2="${f.y2}" stroke="var(--field-line)" stroke-width="1.5"/><circle cx="${f.x1+w/2}" cy="${f.y1+h/2}" r="14" fill="none" stroke="var(--field-line)" stroke-width="1.5"/>`;
  });
  // lugares
  PLACES.forEach(p=>{
    const w=p.x2-p.x1,h=p.y2-p.y1,cx=p.x1+w/2,cy=p.y1+h/2;
    let inner='';
    if(p.id==='25'){ // estadio: gradas + campo
      inner=`<rect class="roof" x="${p.x1}" y="${p.y1}" width="${w}" height="${h}" style="fill:var(--field)"/><rect x="${p.x1+10}" y="${p.y1+2}" width="${w-20}" height="16" fill="var(--roof)"/>`;
      for(let x=p.x1+20;x<p.x2;x+=16)inner+=`<line x1="${x}" y1="${p.y1+24}" x2="${x}" y2="${p.y2-4}" stroke="var(--field-line)" stroke-width="1"/>`;
    } else inner=`<rect class="roof" x="${p.x1}" y="${p.y1}" width="${w}" height="${h}" rx="2"/>`;
    inner+=`<rect class="edge" x="${p.x1}" y="${p.y1}" width="${w}" height="${h}" rx="2"/>`;
    let label='';
    if(p.small){
      label=`<text class="name" x="${cx}" y="${p.y2+11}">${p.lines[0]}</text>`;
    } else {
      const ty=cy+5-(p.lines.length-1)*8;
      label=`<text class="name" x="${cx}" y="${ty}">${p.lines.map((l,i)=>`<tspan x="${cx}" dy="${i?16:0}">${l}</tspan>`).join('')}</text>`;
    }
    let badge='';
    if(typeof p.num==='number'){
      const bx=p.small?cx:p.x1+2,by=p.small?cy:p.y1+2;
      badge=`<g class="badge"><circle cx="${bx}" cy="${by}" r="8"/><text x="${bx}" y="${by+4}">${p.num}</text></g>`;
    }
    s+=`<g class="bld ${p.cat}${p.small?' small':''}${p.id==='25'?' fieldish':''}" data-id="${p.id}">${inner}${label}${badge}</g>`;
  });
  document.getElementById('base').innerHTML=s;
}

// ---------- estado e interacción ----------
let me=[140,262], dest=byId['8'];
let vb={x:0,y:0,w:W,h:H};
const svg=document.getElementById('map'), sel=document.getElementById('dest');
sel.innerHTML='<option value="">Elige un lugar…</option><optgroup label="Edificios">'+
  PLACES.filter(p=>p.cat!=='park').map(p=>`<option value="${p.id}">${p.num}. ${p.name}</option>`).join('')+
  '</optgroup><optgroup label="Estacionamientos">'+PLACES.filter(p=>p.cat==='park').map(p=>`<option value="${p.id}">${p.name}</option>`).join('')+'</optgroup>';

function update(){
  const k=vb.w/W;
  document.getElementById('me').setAttribute('transform',`translate(${me[0]},${me[1]}) scale(${Math.max(.5,k)})`);
  const w=whereAmI(me); document.getElementById('here').textContent=w.text;
  document.querySelectorAll('.bld').forEach(g=>g.classList.toggle('sel',!!dest&&g.dataset.id===dest.id));
  sel.value=dest?dest.id:'';
  const rl=document.getElementById('routeLayer'),fl=document.getElementById('flagLayer'),sm=document.getElementById('summary');
  rl.innerHTML='';fl.innerHTML='';
  if(!dest){sm.className='summary idle';sm.innerHTML='<span class="sub">Elige un destino para ver la ruta.</span>';return}
  if(w.place&&w.place.id===dest.id){sm.className='summary';sm.innerHTML=`<span class="big">Llegaste</span><span class="sub">Ya estás en ${dest.name}.</span>`;return}
  const r=findRoute(me,dest);
  if(!r){sm.className='summary idle';sm.innerHTML='<span class="sub">No encontré un camino desde aquí. Mueve un poco tu ubicación.</span>';return}
  const pts=r.path.map(p=>p.map(v=>v.toFixed(1)).join(',')).join(' ');
  rl.innerHTML=`<polyline class="route-base" points="${pts}"/><polyline class="route-flow" points="${pts}"/>`;
  fl.innerHTML=`<g transform="translate(${r.end[0]},${r.end[1]}) scale(${Math.max(.55,k)})"><circle r="11" fill="var(--route)" stroke="#fff" stroke-width="3"/><path d="M-3,-5 L-3,6 M-3,-5 L5,-2 L-3,1" stroke="#fff" stroke-width="2" fill="none" stroke-linejoin="round"/></g>`;
  const m=Math.round(r.meters/5)*5,min=Math.max(1,Math.ceil(r.meters/1.25/60));
  const tag=typeof dest.num==='number'?`${dest.num}. `:'';
  sm.className='summary';
  sm.innerHTML=`<span class="big">${min} min</span><span class="sub">≈${m} m a pie hasta <strong>${tag}${dest.name}</strong>. Sigue la línea naranja.</span>`;
}
function applyVB(){
  vb.w=Math.max(200,Math.min(1100,vb.w));vb.h=vb.w*H/W;
  vb.x=Math.max(-150,Math.min(W+150-vb.w,vb.x));vb.y=Math.max(-150,Math.min(H+150-vb.h,vb.y));
  svg.setAttribute('viewBox',`${vb.x} ${vb.y} ${vb.w} ${vb.h}`);
  svg.classList.toggle('zoomed',vb.w<560); update();
}
function toSvg(cx,cy){const p=svg.createSVGPoint();p.x=cx;p.y=cy;return p.matrixTransform(svg.getScreenCTM().inverse())}
function zoomAt(px,py,f){vb.x=px-(px-vb.x)/f;vb.y=py-(py-vb.y)/f;vb.w/=f;applyVB()}
function scaleK(){const r=svg.getBoundingClientRect();return Math.max(vb.w/r.width,vb.h/r.height)}
const ptrs=new Map();let mode=null,start=null,pinchD=0;
svg.addEventListener('pointerdown',e=>{
  svg.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,[e.clientX,e.clientY]);
  if(ptrs.size===1){mode=e.target.closest('#me')?'dot':'pan';start={x:e.clientX,y:e.clientY,vx:vb.x,vy:vb.y,moved:false,target:e.target}}
  else if(ptrs.size===2){mode='pinch';const[a,b]=[...ptrs.values()];pinchD=Math.hypot(a[0]-b[0],a[1]-b[1])}
});
svg.addEventListener('pointermove',e=>{
  if(!ptrs.has(e.pointerId))return;ptrs.set(e.pointerId,[e.clientX,e.clientY]);
  if(mode==='dot'){const p=toSvg(e.clientX,e.clientY);me=[Math.max(40,Math.min(970,p.x)),Math.max(40,Math.min(700,p.y))];update()}
  else if(mode==='pan'){const dx=e.clientX-start.x,dy=e.clientY-start.y;if(Math.hypot(dx,dy)>6)start.moved=true;if(start.moved){const k=scaleK();vb.x=start.vx-dx*k;vb.y=start.vy-dy*k;applyVB()}}
  else if(mode==='pinch'&&ptrs.size===2){const[a,b]=[...ptrs.values()],d=Math.hypot(a[0]-b[0],a[1]-b[1]),m=toSvg((a[0]+b[0])/2,(a[1]+b[1])/2);if(pinchD)zoomAt(m.x,m.y,d/pinchD);pinchD=d}
});
function endPtr(e){
  if(mode==='pan'&&start&&!start.moved){const g=start.target.closest&&start.target.closest('.bld');if(g){dest=byId[g.dataset.id];update()}}
  ptrs.delete(e.pointerId);if(ptrs.size===0||mode==='pinch')mode=null;
}
svg.addEventListener('pointerup',endPtr);svg.addEventListener('pointercancel',endPtr);
svg.addEventListener('wheel',e=>{e.preventDefault();const p=toSvg(e.clientX,e.clientY);zoomAt(p.x,p.y,e.deltaY<0?1.15:1/1.15)},{passive:false});
document.getElementById('zin').onclick=()=>zoomAt(vb.x+vb.w/2,vb.y+vb.h/2,1.3);
document.getElementById('zout').onclick=()=>zoomAt(vb.x+vb.w/2,vb.y+vb.h/2,1/1.3);
document.getElementById('zfit').onclick=()=>{vb={x:0,y:0,w:W,h:H};applyVB()};
sel.addEventListener('change',()=>{dest=sel.value?byId[sel.value]:null;update()});
buildBase();applyVB();
</script>
