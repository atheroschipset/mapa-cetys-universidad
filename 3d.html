<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mapa CETYS 3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@600;700&display=swap">
<style>
/* Vista isométrica tipo diorama (cámara de RPG). Escena a pantalla completa con panel flotante abajo. */
:root{
  --panel:rgba(255,255,255,.95); --fg:#1b2420; --muted:#5b6a62; --line:#d4ddd7; --soft:#eef1ee;
  --route:#ff6a1a; --accent:#1f6f8b; --me:#2f6fde; --ok:#1d8a4f;
  --c-acad:#4a78cf; --c-serv:#1f9e80; --c-cult:#b8478f; --c-dep:#76962c; --c-park:#7a828f;
  --f-display:"Barlow Condensed","Arial Narrow",sans-serif; --f-body:"Barlow",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
[hidden]{display:none!important}
body{background:#bfe3f2;color:var(--fg);font-family:var(--f-body);font-size:15px;overflow:hidden}
#stage{position:fixed;inset:0;touch-action:none}
canvas{display:block}
.top{position:fixed;top:0;left:0;right:0;padding-top:calc(env(safe-area-inset-top,0px) + 10px);padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));display:flex;justify-content:space-between;align-items:flex-start;gap:10px;pointer-events:none}
.title{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:7px 12px;pointer-events:auto;display:grid;gap:2px;min-width:0}
.title small{font-family:var(--f-display);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);font-weight:700}
.title b{font-family:var(--f-display);font-size:20px;font-weight:700;line-height:1.05}
.title a{font-size:13px;color:var(--accent);font-weight:600}
.tag{margin-top:6px;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:4px 10px;font-size:12px;color:var(--muted);display:inline-block}
.tag.live{color:var(--ok);font-weight:600}
.tag.warn{color:var(--route);font-weight:600}
.tools{display:flex;flex-direction:column;gap:6px;pointer-events:auto}
.tools button{width:42px;height:42px;border-radius:12px;border:1px solid var(--line);background:var(--panel);color:var(--fg);font-size:18px;font-weight:700;cursor:pointer;box-shadow:0 3px 10px rgba(0,0,0,.15)}
button:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.bottom{position:fixed;left:0;right:0;bottom:0;padding-bottom:calc(env(safe-area-inset-bottom,0px) + 10px);padding-left:max(10px,env(safe-area-inset-left,0px));padding-right:max(10px,env(safe-area-inset-right,0px));display:grid;gap:8px;justify-items:center;pointer-events:none}
.card{width:100%;max-width:520px;background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:0 8px 24px rgba(0,0,0,.18);pointer-events:auto}
.nav{padding:10px 12px;display:grid;gap:8px;max-height:46vh;overflow-y:auto}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.lbl{font-family:var(--f-display);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700}
.here{display:flex;align-items:center;gap:8px;min-width:0}
.here i{width:12px;height:12px;border-radius:50%;background:var(--me);box-shadow:0 0 0 4px color-mix(in srgb,var(--me) 25%,transparent);flex:none}
.here strong{font-weight:600;min-width:0}
select{font:inherit;font-size:16px;padding:8px 10px;border-radius:10px;border:1px solid var(--line);background:#fff;color:var(--fg);flex:1;min-width:0}
.btn{font:inherit;font-weight:600;font-size:14px;padding:8px 12px;border-radius:10px;border:1px solid var(--line);background:var(--soft);color:var(--fg);cursor:pointer}
.btn.primary{background:var(--route);border-color:var(--route);color:#fff}
.btn.on{background:var(--me);border-color:var(--me);color:#fff}
.btn:disabled{opacity:.45;cursor:default}
.sum{font-size:14px;color:var(--muted)} .sum b{font-family:var(--f-display);font-size:22px;color:var(--route);margin-right:6px}
.sum.arrived b{color:var(--ok)}
.msg{margin:0;font-size:12.5px;color:var(--muted);line-height:1.4}
.msg b{color:var(--fg)}
.calib{display:grid;gap:6px;border-top:1px dashed var(--line);padding-top:8px}
/* tarjeta de edificio */
.pop{overflow:hidden;display:grid;max-width:380px}
.pop .photo{position:relative;aspect-ratio:16/9;max-width:100%;overflow:hidden}
.pop .photo img{width:100%;height:100%;object-fit:cover;display:block}
.pop .ph{position:absolute;inset:0;display:grid;place-items:center;align-content:center;gap:2px;text-align:center}
.pop .ph .n{font-family:var(--f-display);font-size:44px;font-weight:700;line-height:1}
.pop .ph small{font-size:12px;color:var(--muted)}
.pop .close{position:absolute;top:8px;right:8px;width:34px;height:34px;border-radius:50%;border:0;background:rgba(0,0,0,.55);color:#fff;font-size:18px;cursor:pointer}
.pop .body{padding:10px 14px 12px;display:grid;gap:6px}
.pop .cat{font-family:var(--f-display);font-size:11px;letter-spacing:.1em;text-transform:uppercase;font-weight:700}
.pop h2{margin:0;font-family:var(--f-display);font-size:21px;line-height:1.1}
.noscript{position:fixed;inset:0;display:grid;place-items:center;padding:24px;text-align:center;background:#eef1ee}
</style>
</head>
<body>
<div id="stage"></div>
<div class="top">
  <div>
    <div class="title"><small>Campus Mexicali · 3D</small><b>Mapa CETYS Universidad</b><a href="./">Cambiar a vista 2D</a></div>
    <span class="tag" id="tag">Simulación: toca el suelo para moverte</span>
  </div>
  <div class="tools">
    <button id="rotL" aria-label="Girar cámara a la izquierda">⟲</button>
    <button id="rotR" aria-label="Girar cámara a la derecha">⟳</button>
    <button id="zin" aria-label="Acercar">+</button>
    <button id="zout" aria-label="Alejar">−</button>
    <button id="zme" aria-label="Centrar en mi ubicación">◎</button>
  </div>
</div>
<div class="bottom">
  <div class="card pop" id="pop" hidden>
    <div class="photo" id="popPhoto">
      <img id="popImg" alt="" hidden>
      <div class="ph" id="popPh"><span class="n" id="popN"></span><small>Foto pendiente</small></div>

      <div class="row"><button class="btn primary" id="popGo">Ir aquí</button><span class="msg" id="popDist"></span></div>
    </div>
  </div>
  <div class="card nav">
    <div class="row" style="justify-content:space-between"><div class="here"><i></i><span class="lbl">Estás en</span><strong id="here">—</strong></div></div>
    <div class="row"><select id="dest" aria-label="Destino"></select><button class="btn primary" id="walk">Simular</button></div>
    <div class="sum" id="sum"></div>
    <div class="row"><button class="btn" id="gpsBtn">Usar mi GPS</button><button class="btn" id="calBtn">Calibrar mapa</button></div>
    <p class="msg" id="gpsMsg">Toca un edificio para ver su foto. Gira con dos dedos o con los botones ⟲ ⟳.</p>
    <div class="calib" id="calib" hidden>
      <p class="msg" id="calMsg"></p>
      <div class="row"><button class="btn primary" id="calMark">Marcar dónde estoy</button><button class="btn" id="calClear">Borrar puntos</button><button class="btn" id="calDone">Listo</button></div>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
if(!window.THREE){document.body.insertAdjacentHTML('beforeend','<div class="noscript"><p>No se pudo cargar el motor 3D. Revisa tu conexión o usa la <a href="./">vista 2D</a>.</p></div>')}
// Plano trazado sobre la vista satelital (norte arriba). Coordenadas en píxeles de la captura × 1.25.
// Escala sacada del campo de fútbol americano (109.7 m entre fondos de zonas de anotación).
let M = 0.62;             // metros por unidad del plano (se ajusta al calibrar)
const W = 1000, H = 860, CELL = 5, K = 1.25;
const CATNAME={acad:'Académico',serv:'Servicios',cult:'Cultura',dep:'Deporte',park:'Estacionamiento'};
// [núm, nombre, etiqueta, tipo, x1,y1,x2,y2, pequeño]
const RAW = [ // coordenadas en píxeles de la captura satelital
  [1,'Dirección General',['Dirección','General'],'serv',182,462,215,492],
  [2,'CASE',['CASE'],'serv',238,458,265,484,1],
  [3,'Cafetería',['Cafetería'],'serv',240,412,295,440],
  [4,'Sorteos',['Sorteos'],'serv',168,388,198,408,1],
  [5,'Seguridad',['Seguridad'],'serv',208,404,234,424,1],
  [6,'Mantenimiento',['Mantenimiento'],'serv',222,366,250,388,1],
  [7,'Oficinas Administrativas',['Oficinas Adm.'],'serv',272,368,300,392,1],
  [8,'Biblioteca',['Biblioteca'],'acad',305,366,360,440],
  [9,'Enfermería y Escolar',['Enfermería y Escolar'],'serv',364,364,397,440,1],
  [10,'Auditorio',['Auditorio'],'cult',328,492,378,530],
  [11,'CECE',['CECE'],'acad',386,518,460,575],
  [12,'Edificio de Licenciatura',['Licenciatura'],'acad',485,525,522,598],
  [13,'Servicios Estudiantiles y Comunicación',['Serv. Estudiantiles'],'serv',402,372,428,438,1],
  [14,'Operación Académica y Dirección Académica',['Op. Académica'],'serv',440,398,474,425,1],
  [15,'Laboratorios de Ingeniería y CAOP',['Labs. Ingeniería'],'acad',448,360,512,390,1],
  [16,'Edificio Tita y Armando Gallego',['Tita y A. Gallego'],'acad',465,442,500,468,1],
  [17,'Edificio Esposos Hermosillo',['Esp. Hermosillo'],'acad',482,402,520,428,1],
  [18,'Edificio Kenworth',['Kenworth'],'acad',515,426,540,447,1],
  [19,'Edificio Heriberto Amarillas Heras y Clara Durazo de Amarillas',['Amarillas'],'acad',522,456,556,478,1],
  [20,'CEDENI',['CEDENI'],'acad',545,520,590,560],
  [21,'CAT',['CAT'],'acad',572,468,640,500],
  [22,'Educación Continua y Centro de Idiomas',['Idiomas'],'acad',745,540,785,588],
  [23,'Preparatoria',['Preparatoria'],'acad',330,222,500,330],
  [24,'Gimnasio',['Gimnasio'],'dep',60,145,135,200],
  [25,'Estadio de los Zorros',['Estadio'],'dep',318,48,402,200],
  [26,'CEID',['CEID'],'acad',592,292,690,455],
  ['P1','Estacionamiento techado (Gimnasio)',['Est. techado'],'park',50,45,150,130],
  ['P2','Estacionamiento Norte',['Est. Norte'],'park',170,45,265,145],
  ['P3','Estacionamiento Gómez Morín',['Est. Gómez Morín'],'park',25,270,98,500],
  ['P4','Estacionamiento Poniente',['Est. Poniente'],'park',166,320,212,505],
  ['P5','Estacionamiento frente al Auditorio',['Est. Auditorio'],'park',300,560,495,662],
  ['P6','Estacionamiento Calzada CETYS',['Est. Calzada'],'park',195,512,298,592],
  ['P7','Estacionamiento Centro de Idiomas',['Est. Idiomas'],'park',640,592,788,664],
  ['P8','Estacionamiento CEID',['Est. CEID'],'park',738,345,788,460]
];
const sc=v=>Math.round(v*K);
const PLACES = RAW.map(r=>({num:r[0],id:String(r[0]),name:r[1],lines:r[2],cat:r[3],x1:sc(r[4]),y1:sc(r[5]),x2:sc(r[6]),y2:sc(r[7]),small:!!r[8]}));
const byId = Object.fromEntries(PLACES.map(p=>[p.id,p]));
const R4=(k,a,b,c,d)=>({k,x1:sc(a),y1:sc(b),x2:sc(c),y2:sc(d)});
const FIELDS = [R4('soc',527,50,605,280),R4('soc',648,100,735,245),R4('base',212,182,312,288)];
const OTHER = [R4('b',25,235,135,265),R4('b',103,275,135,350),R4('b',103,425,140,485),R4('b',220,290,300,332),R4('b',278,45,312,150)]; // edificios sin número en el mapa oficial
// contorno del campus (pegado a Gómez Morín, la calle norte, el lado oriente y Calzada CETYS)
const CAMPUS=[[22,38],[778,38],[786,668],[300,668],[22,520]].map(p=>[sc(p[0]),sc(p[1])]);
function inPoly(x,y,poly){let c=false;for(let i=0,j=poly.length-1;i<poly.length;j=i++){const[xi,yi]=poly[i],[xj,yj]=poly[j];if((yi>y)!==(yj>y)&&x<(xj-xi)*(y-yi)/(yj-yi)+xi)c=!c}return c}
const store={get(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};

// ---------- rejilla para calcular rutas ----------
const COLS=W/CELL|0, ROWS=H/CELL|0, blocked=new Uint8Array(COLS*ROWS);
const obst=[...PLACES.filter(p=>p.cat!=='park'),...FIELDS,...OTHER];
for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){
  const x=c*CELL+CELL/2,y=r*CELL+CELL/2;
  let b = !inPoly(x,y,CAMPUS);
  if(!b) b = obst.some(o=>x>o.x1-2&&x<o.x2+2&&y>o.y1-2&&y<o.y2+2);
  blocked[r*COLS+c]=b?1:0;
}
const cellOf=(x,y)=>[Math.max(0,Math.min(COLS-1,x/CELL|0)),Math.max(0,Math.min(ROWS-1,y/CELL|0))];
const ctr=(c,r)=>[c*CELL+CELL/2,r*CELL+CELL/2];
const rectDist=(x,y,p)=>Math.hypot(Math.max(p.x1-x,0,x-p.x2),Math.max(p.y1-y,0,y-p.y2));
function nearestFree(c,r){
  if(!blocked[r*COLS+c])return [c,r];
  for(let d=1;d<60;d++)for(let dc=-d;dc<=d;dc++)for(let dr=-d;dr<=d;dr++){
    if(Math.max(Math.abs(dc),Math.abs(dr))!==d)continue;
    const cc=c+dc,rr=r+dr; if(cc>=0&&rr>=0&&cc<COLS&&rr<ROWS&&!blocked[rr*COLS+cc])return [cc,rr];
  }
  return [c,r];
}
function lineFree(a,b){
  const n=Math.ceil(Math.hypot(b[0]-a[0],b[1]-a[1])/2);
  for(let i=1;i<n;i++){const x=a[0]+(b[0]-a[0])*i/n,y=a[1]+(b[1]-a[1])*i/n,[c,r]=cellOf(x,y);if(blocked[r*COLS+c])return false}
  return true;
}
function findRoute(pt,place){
  const [sc,sr]=nearestFree(...cellOf(pt[0],pt[1])), start=sr*COLS+sc;
  const goalOK=i=>{const[x,y]=ctr(i%COLS,i/COLS|0);return rectDist(x,y,place)<=9};
  const hfun=i=>{const[x,y]=ctr(i%COLS,i/COLS|0);return Math.max(0,rectDist(x,y,place)-9)};
  const g=new Float32Array(COLS*ROWS).fill(Infinity), prev=new Int32Array(COLS*ROWS).fill(-1), closed=new Uint8Array(COLS*ROWS);
  const heap=[]; const push=(i,f)=>{heap.push([f,i]);let k=heap.length-1;while(k){const p=(k-1)>>1;if(heap[p][0]<=heap[k][0])break;[heap[p],heap[k]]=[heap[k],heap[p]];k=p}};
  const pop=()=>{const top=heap[0],last=heap.pop();if(heap.length){heap[0]=last;let k=0;for(;;){const l=2*k+1,r=l+1;let m=k;if(l<heap.length&&heap[l][0]<heap[m][0])m=l;if(r<heap.length&&heap[r][0]<heap[m][0])m=r;if(m===k)break;[heap[m],heap[k]]=[heap[k],heap[m]];k=m}}return top};
  g[start]=0; push(start,hfun(start)); let goal=-1;
  while(heap.length){
    const [,i]=pop(); if(closed[i])continue; closed[i]=1;
    if(goalOK(i)){goal=i;break}
    const c=i%COLS,r=i/COLS|0;
    for(let dc=-1;dc<=1;dc++)for(let dr=-1;dr<=1;dr++){
      if(!dc&&!dr)continue; const cc=c+dc,rr=r+dr; if(cc<0||rr<0||cc>=COLS||rr>=ROWS)continue;
      const j=rr*COLS+cc; if(blocked[j]||closed[j])continue;
      if(dc&&dr&&(blocked[r*COLS+cc]||blocked[rr*COLS+c]))continue;
      const ng=g[i]+(dc&&dr?1.4142:1)*CELL;
      if(ng<g[j]){g[j]=ng;prev[j]=i;push(j,ng+hfun(j))}
    }
  }
  if(goal<0)return null;
  const raw=[]; for(let i=goal;i!==-1;i=prev[i])raw.unshift(ctr(i%COLS,i/COLS|0));
  const sm=[raw[0]]; let k=0;
  while(k<raw.length-1){let j=raw.length-1;while(j>k+1&&!lineFree(raw[k],raw[j]))j--;sm.push(raw[j]);k=j}
  const path=[pt,...sm]; let len=0; for(let i=1;i<path.length;i++)len+=Math.hypot(path[i][0]-path[i-1][0],path[i][1]-path[i-1][1]);
  return {path,meters:len*M,end:sm[sm.length-1]};
}
function whereAmI(pt){
  const inside=PLACES.find(p=>pt[0]>=p.x1&&pt[0]<=p.x2&&pt[1]>=p.y1&&pt[1]<=p.y2);
  if(inside)return {text:inside.name,place:inside};
  let n=PLACES[0],bd=Infinity; PLACES.forEach(p=>{const d=rectDist(pt[0],pt[1],p);if(d<bd){bd=d;n=p}});
  return {text:'Cerca de '+n.name,place:null,near:n,dist:bd};
}


let calib=store.get('cetys-calib')||[], xf=null;
function toLocal(lat,lng){const o=calib[0]||{lat,lng};return [(lng-o.lng)*Math.cos(o.lat*Math.PI/180)*111320,(lat-o.lat)*110540]}
function solve3(A,b){ // eliminación gaussiana 3x3
  const m=A.map((r,i)=>[...r,b[i]]);
  for(let c=0;c<3;c++){let p=c;for(let r=c+1;r<3;r++)if(Math.abs(m[r][c])>Math.abs(m[p][c]))p=r;[m[c],m[p]]=[m[p],m[c]];if(Math.abs(m[c][c])<1e-12)return null;
    for(let r=0;r<3;r++)if(r!==c){const f=m[r][c]/m[c][c];for(let k=c;k<4;k++)m[r][k]-=f*m[c][k]}}
  return [m[0][3]/m[0][0],m[1][3]/m[1][1],m[2][3]/m[2][2]];
}
function buildXf(){
  xf=null; if(calib.length<2)return;
  const P=calib.map(c=>({g:toLocal(c.lat,c.lng),x:c.x,y:c.y}));
  if(P.length===2){
    // similitud con números complejos: z_plano = a*z_geo + b, con y del plano hacia abajo
    const g1=[P[0].g[0],-P[0].g[1]],g2=[P[1].g[0],-P[1].g[1]];
    const dg=[g2[0]-g1[0],g2[1]-g1[1]],dm=[P[1].x-P[0].x,P[1].y-P[0].y],den=dg[0]**2+dg[1]**2;
    if(den<25)return; // puntos demasiado juntos (<5 m)
    const a=[(dm[0]*dg[0]+dm[1]*dg[1])/den,(dm[1]*dg[0]-dm[0]*dg[1])/den];
    const b=[P[0].x-(a[0]*g1[0]-a[1]*g1[1]),P[0].y-(a[0]*g1[1]+a[1]*g1[0])];
    xf=(e,n)=>{const gx=e,gy=-n;return [a[0]*gx-a[1]*gy+b[0],a[0]*gy+a[1]*gx+b[1]]};
    M=1/Math.hypot(a[0],a[1]);
  } else {
    const A=[[0,0,0],[0,0,0],[0,0,0]],bx=[0,0,0],by=[0,0,0];
    P.forEach(p=>{const v=[p.g[0],p.g[1],1];for(let i=0;i<3;i++){for(let j=0;j<3;j++)A[i][j]+=v[i]*v[j];bx[i]+=v[i]*p.x;by[i]+=v[i]*p.y}});
    const cx=solve3(A,bx),cy=solve3(A,by); if(!cx||!cy)return;
    xf=(e,n)=>[cx[0]*e+cx[1]*n+cx[2],cy[0]*e+cy[1]*n+cy[2]];
    M=1/Math.sqrt(Math.abs(cx[0]*cy[1]-cx[1]*cy[0]));
  }
}


// ---------- escena 3D ----------
const CATCOL={acad:'#4a78cf',serv:'#1f9e80',cult:'#b8478f',dep:'#76962c',park:'#7a828f'};
const HEIGHT={1:18,2:10,3:12,4:8,5:8,6:8,7:10,8:18,9:12,10:20,11:26,12:24,13:10,14:10,15:12,16:12,17:12,18:12,19:12,20:16,21:20,22:14,23:9,24:22,26:26}; // unidades (1 u ≈ 0.62 m)
const stage=document.getElementById('stage');
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(2,window.devicePixelRatio||1));renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
stage.appendChild(renderer.domElement);
const scene=new THREE.Scene();scene.background=new THREE.Color('#bfe3f2');

  return `Puntos guardados: <b>${n}</b>. `+(n<2?'Párate en un lugar fácil de ubicar (esquina de edificio o entrada), espera a que la precisión baje de 10 m y toca "Marcar dónde estoy".':n<3?'Ya funciona. Un tercer punto lejos de los otros dos mejora la precisión.':'Calibración lista. Agrega más puntos si te ves desviado.')}
function refreshCal(){calMsg.innerHTML=calText();drawCalib()}
function onFix(pos){
  lastFix={lat:pos.coords.latitude,lng:pos.coords.longitude,acc:pos.coords.accuracy,t:Date.now()};
  const accTxt=`±${Math.round(lastFix.acc)} m`;
  if(!xf){setTag('GPS activo · falta calibrar','warn');gpsMsg.innerHTML=`GPS recibido (precisión ${accTxt}). Calibra el mapa para que el alumno siga tu posición.`;return}
  const[x,y]=xf(...toLocal(lastFix.lat,lastFix.lng));
  me=[Math.max(-100,Math.min(W+100,x)),Math.max(-100,Math.min(H+100,y))];
  const off=!inPoly(x,y,CAMPUS);
  setTag(off?'Estás fuera del campus':'En vivo · precisión '+accTxt,off?'warn':'live');
  gpsMsg.innerHTML=`Siguiendo tu posición (precisión ${accTxt}). La ruta se recalcula mientras caminas.`;
  accDisc.visible=true;accDisc.scale.setScalar(Math.min(150,lastFix.acc/M));
  update();
}
function onErr(e){gpsMsg.textContent=e.code===1?'No hay permiso de ubicación. Actívalo para este sitio en tu navegador.':e.code===3?'El GPS tardó demasiado. Sal al aire libre e inténtalo de nuevo.':'No se pudo obtener la ubicación.';setTag('GPS no disponible','warn');stopGps()}

  try{watchId=navigator.geolocation.watchPosition(onFix,onErr,{enableHighAccuracy:true,maximumAge:1000,timeout:20000})}catch(e){onErr({code:1})}
}

stage.addEventListener('pointerdown',e=>{stage.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,[e.clientX,e.clientY]);
  if(ptrs.size===1)drag={x:e.clientX,y:e.clientY,g:ground(e.clientX,e.clientY),t0:target.clone(),moved:false,rot:e.button===2||e.shiftKey,yaw0:yawTarget};
  else if(ptrs.size===2){const[a,b]=[...ptrs.values()];pinch=Math.hypot(a[0]-b[0],a[1]-b[1]);pinchA=Math.atan2(b[1]-a[1],b[0]-a[0]);drag=null}});
stage.addEventListener('pointermove',e=>{if(!ptrs.has(e.pointerId))return;ptrs.set(e.pointerId,[e.clientX,e.clientY]);
  if(drag&&drag.rot){if(Math.hypot(e.clientX-drag.x,e.clientY-drag.y)>6)drag.moved=true;yawTarget=yaw=drag.yaw0-(e.clientX-drag.x)*0.008}
  else if(drag){if(Math.hypot(e.clientX-drag.x,e.clientY-drag.y)>6){drag.moved=true;follow=false}if(drag.moved){target.copy(drag.t0);placeCam();const g=ground(e.clientX,e.clientY);target.copy(drag.t0).sub(g.sub(drag.g));target.y=0}}
  else if(ptrs.size===2){const[a,b]=[...ptrs.values()],d=Math.hypot(a[0]-b[0],a[1]-b[1]),ang=Math.atan2(b[1]-a[1],b[0]-a[0]);if(pinch)zoom=Math.max(.9,Math.min(7,zoom*d/pinch));pinch=d;
    let da=ang-pinchA;if(da>Math.PI)da-=2*Math.PI;if(da<-Math.PI)da+=2*Math.PI;yawTarget=yaw=yawTarget-da;pinchA=ang}});
function endP(e){
  if(drag&&!drag.moved&&!drag.rot){
    if(pickMode){const g=ground(e.clientX,e.clientY);calib.push({lat:pendingFix.lat,lng:pendingFix.lng,acc:pendingFix.acc,x:+(g.x+CX).toFixed(1),y:+(g.z+CZ).toFixed(1)});store.set('cetys-calib',calib);pickMode=false;buildXf();refreshCal();
      if(xf&&lastFix)onFix({coords:{latitude:lastFix.lat,longitude:lastFix.lng,accuracy:lastFix.acc}})}
    else{ndc.set(e.clientX/innerWidth*2-1,-(e.clientY/innerHeight)*2+1);ray.setFromCamera(ndc,cam);const hit=ray.intersectObjects(pickables)[0];
      if(hit)openPopup(byId[hit.object.userData.id]);
      else if(peek)closePopup();
      else if(!live){const g=ground(e.clientX,e.clientY),x=g.x+CX,y=g.z+CZ;if(inPoly(x,y,CAMPUS)){me=[x,y];walking=null;arrivedFor=null;update()}}}}
  ptrs.delete(e.pointerId);if(!ptrs.size){drag=null;pinch=0}}
stage.addEventListener('pointerup',endP);stage.addEventListener('pointercancel',endP);
stage.addEventListener('wheel',e=>{e.preventDefault();zoom=Math.max(.9,Math.min(7,zoom*(e.deltaY<0?1.12:1/1.12)))},{passive:false});
document.getElementById('zin').onclick=()=>zoom=Math.min(7,zoom*1.25);
document.getElementById('zout').onclick=()=>zoom=Math.max(.9,zoom/1.25);
document.getElementById('zme').onclick=()=>{follow=true;zoom=Math.max(zoom,2.6)};
document.getElementById('rotL').onclick=()=>yawTarget-=Math.PI/2;
document.getElementById('rotR').onclick=()=>yawTarget+=Math.PI/2;
function resize(){renderer.setSize(innerWidth,innerHeight);placeCam()}addEventListener('resize',resize);

// ---------- animación ----------
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;let last=performance.now();const tmp=new THREE.Vector3();
function loop(now){const dt=Math.min(.05,(now-last)/1000);last=now;
  yaw+=(yawTarget-yaw)*Math.min(1,dt*8);
  if(walking){walking.t+=dt*80;const t=Math.min(walking.t,walking.total);const s=walking.segs.find(s=>t<=s[2]+s[3])||walking.segs[walking.segs.length-1];const f=s[3]?(t-s[2])/s[3]:1;
    me=[s[0][0]+(s[1][0]-s[0][0])*f,s[0][1]+(s[1][1]-s[0][1])*f];setHero();hero.rotation.y=Math.atan2(s[1][0]-s[0][0],s[1][1]-s[0][1]);
    const sw=Math.sin(now/70)*0.6;legL.position.z=sw*1.5;legR.position.z=-sw*1.5;
    if(walking.t>=walking.total){walking=null;legL.position.z=legR.position.z=0;update()}}
  if(follow){tmp.set(hero.position.x,0,hero.position.z);target.lerp(tmp,Math.min(1,dt*(walking||live?2.5:6)));if(!walking&&!live&&target.distanceTo(tmp)<0.5)follow=false}
  if(!reduce){gem.rotation.y+=dt*2;gem.position.y=20+Math.sin(now/300)*3;head.position.y=13.5+(walking?Math.abs(Math.sin(now/90)):0)}else gem.position.y=20;
  placeCam();renderer.render(scene,cam);requestAnimationFrame(loop)}
resize();update();refreshCal();requestAnimationFrame(loop);
</script>
</body>
